# fly.toml app configuration file generated for transfermarkt-api on 2024-04-06T13:49:40-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'transfermarkt-api'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # The response cache and the anti-bot clearance cookie both live in process memory, so scaling to
  # zero throws them away on every idle period and every cold start re-scrapes from scratch. Keeping
  # one machine up is what makes the cache worth having.
  # ('auto_stop_machines = "suspend"' snapshots RAM instead of killing it, if available on your plan.)
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
